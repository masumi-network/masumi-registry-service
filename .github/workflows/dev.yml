name: Test-runner
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Jest
        run: pnpm run test

      - name: Run Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run Frontend ESLint
        run: pnpm -C frontend run lint

      - name: Run Frontend TypeScript Check
        run: pnpm run typecheck:frontend

      - name: Run Frontend Format Check
        run: pnpm -C frontend run format:check

      - name: Run Frontend Tests
        run: pnpm run test:frontend

      # Regenerates the OpenAPI spec and the frontend client from it, then fails
      # if that changes any committed file. Fix: run `pnpm check:api-client`
      # locally and commit the result.
      - name: Check Generated API Client Is Up To Date
        run: pnpm run check:api-client

      - name: Run ESLint for issues
        id: lint_fix_remaining
        run: |
          pnpm exec eslint --fix --config eslint.config.mjs src/ > lint-results.txt || true

      - name: Check Lint Results File
        run: |
          if [ -s lint-results.txt ]; then echo "Lint issues found. Please fix them." && exit 1; fi
