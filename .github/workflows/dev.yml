name: Test-runner
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Jest
        run: pnpm run test

      - name: Run Build
        run: pnpm run build

      - name: Run Open API Generator
        run: pnpm run swagger-json

      # Read-only (no --fix) so CI checks the committed code. Any nonzero exit
      # fails the job: lint errors, warnings (--max-warnings 0) and config or
      # crash errors alike, with ESLint's own output left in the log.
      - name: Run ESLint
        run: pnpm exec eslint --config eslint.config.mjs --max-warnings 0 src/
